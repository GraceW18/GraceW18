<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currently...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    padding: 2rem 1.5rem 2.5rem;
    color: #1a1a1a;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.75rem;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 38px; }
  }

  /* COLUMN */
  .col { border-top: 2px solid #1a1a1a; padding-top: 0.75rem; }

  .col-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .col-icon { width: 20px; height: 20px; flex-shrink: 0; color: #1a1a1a; }
  .col-title { font-size: 15px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.01em; }

  /* ITEMS */
  .item { margin-bottom: 0.9rem; }
  .item-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 2px;
  }
  .item-name { font-size: 13px; font-weight: 500; color: #1a1a1a; line-height: 1.4; }
  .item-sub  { font-size: 12px; color: #777; font-style: italic; margin-top: 1px; line-height: 1.35; }

  /* ICON ANIMATIONS */
  .icon-book { animation: rock 3.5s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes rock { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }

  .bar { transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
  .bar:nth-child(1){animation-delay:0s}
  .bar:nth-child(2){animation-delay:0.15s}
  .bar:nth-child(3){animation-delay:0.3s}
  .bar:nth-child(4){animation-delay:0.45s}
  @keyframes eq { 0%,100%{transform:scaleY(0.25)} 50%{transform:scaleY(1)} }

  .icon-eye { animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
  @keyframes blink {
    0%,85%,100% { transform: scaleY(1); }
    91%,94%     { transform: scaleY(0.08); }
  }

  .icon-gear { animation: spin 7s linear infinite; transform-origin: center; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     ✏️  EDIT YOUR DATA HERE
     ═══════════════════════════════════════════════════════════════ -->
<script>
const DATA = {

  subtitle: "A running log of what has my attention — books, sound, screens, and the thing I'm building.",

  // Words the header cycles through
  rotatingWords: ["Currently", "As of Today", "Right Now", "This Week"],

  columns: [
    {
      title: "Reading",
      icon: "book",
      items: [
        { label: "For Research",   name: '"Attention Is All You Need"',       sub: "Vaswani, Shazeer, Parmar et al." },
        { label: "For Fun",        name: "Piranesi",                          sub: "Susanna Clarke" },
        { label: "Blog / Article", name: '"The Bitter Lesson"',               sub: "Rich Sutton" },
        { label: "Manga",          name: "Vinland Saga",                      sub: "Makoto Yukimura" },
      ]
    },
    {
      title: "Listening to",
      icon: "music",
      items: [
        { label: "Song",      name: '"Weightless"',                  sub: "Marconi Union" },
        { label: "Audiobook", name: "Gödel, Escher, Bach",           sub: "Douglas R. Hofstadter" },
        { label: "Podcast",   name: '"The Sound of Music, Decoded"', sub: "Lex Fridman with Rick Beato" },
      ]
    },
    {
      title: "Watching",
      icon: "eye",
      items: [
        { label: "TV Show", name: "Severance" },
        { label: "Anime",   name: "Frieren: Beyond Journey's End" },
      ]
    },
    {
      title: "Working On",
      icon: "gear",
      items: [
        { label: "Building", name: "Audio to Sheet Music Converter",      sub: "Pitch detection → MIDI → engraved score" },
        { label: "Learning", name: "Rust + WebAssembly for real-time DSP", sub: "Also: PyTorch audio transformers" },
      ]
    }
  ]
};
</script>
<!-- Inline SVG icon defs -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-book" viewBox="0 0 22 22" fill="none">
    <g class="icon-book">
      <rect x="3" y="3" width="7" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
      <rect x="12" y="3" width="7" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3" y1="7" x2="10" y2="7" stroke="currentColor" stroke-width="1.2"/>
    </g>
  </symbol>
  <symbol id="icon-music" viewBox="0 0 22 22" fill="none">
    <rect class="bar" x="2"    y="6" width="3" height="10" rx="1" fill="currentColor"/>
    <rect class="bar" x="6.5"  y="4" width="3" height="14" rx="1" fill="currentColor"/>
    <rect class="bar" x="11"   y="7" width="3" height="9"  rx="1" fill="currentColor"/>
    <rect class="bar" x="15.5" y="5" width="3" height="12" rx="1" fill="currentColor"/>
  </symbol>
  <symbol id="icon-eye" viewBox="0 0 22 22" fill="none">
    <g class="icon-eye">
      <ellipse cx="11" cy="11" rx="8" ry="5" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="2.5" fill="currentColor"/>
      <circle cx="12" cy="10" r="0.8" fill="white"/>
    </g>
  </symbol>
  <symbol id="icon-gear" viewBox="0 0 22 22" fill="none">
    <g class="icon-gear">
      <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
    </g>
    <circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
</svg>

<div id="root"></div>

<script>
// Render
const root = document.getElementById('root');

root.innerHTML = `
  <div class="title-row">
    <h1><span id="word-wrap"><span id="word-inner">${DATA.rotatingWords[0]}</span></span></h1><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
  </div>
  <p class="subtitle">${DATA.subtitle}</p>
  <hr>
  <div class="grid" id="grid"></div>
`;

const grid = document.getElementById('grid');

DATA.columns.forEach(col => {
  const items = col.items.map(item => `
    <div class="item">
      <div class="item-label">${item.label || ''}</div>
      <div class="item-name">${item.name}</div>
      ${item.sub ? `<div class="item-sub">${item.sub}</div>` : ''}
    </div>
  `).join('');

  grid.innerHTML += `
    <div class="col">
      <div class="col-header">
        <svg class="col-icon" aria-hidden="true"><use href="#icon-${col.icon}"/></svg>
        <span class="col-title">${col.title}</span>
      </div>
      ${items}
    </div>
  `;
});

// Word rotation
let idx = 0;
const inner = document.getElementById('word-inner');

setInterval(() => {
  idx = (idx + 1) % DATA.rotatingWords.length;

  inner.classList.remove('in');
  inner.classList.add('out');

  setTimeout(() => {
    inner.textContent = DATA.rotatingWords[idx];
    inner.classList.remove('out');
    // force reflow so the 'in' animation restarts cleanly
    void inner.offsetWidth;
    inner.classList.add('in');
  }, 260);

}, 3500);
</script>

</body>
</html>
