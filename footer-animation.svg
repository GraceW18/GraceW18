<!-- Footer animation -->
<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A black cat sailing a boat across smooth waves toward mountains">

  <style>
    @keyframes sail {
      0%   { transform: translateX(-220px); }
      100% { transform: translateX(1350px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(5px) rotate(1.2deg); }
    }
    @keyframes waveDrift1 {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-240px); }
    }
    @keyframes waveDrift2 {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-180px); }
    }
    @keyframes waveDrift3 {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-300px); }
    }
    @keyframes flagWave {
      0%, 100% { transform: scaleX(1) skewY(0deg); }
      50%      { transform: scaleX(0.82) skewY(-8deg); }
    }
    @keyframes catWiggle {
      0%, 100% { transform: rotate(-1.5deg); }
      50%      { transform: rotate(2deg); }
    }
    .boat-sail   { animation: sail 24s linear infinite; }
    .bob         { animation: bob 3s ease-in-out infinite; transform-origin: 0px 6px; }
    .wave-1      { animation: waveDrift1 11s linear infinite; }
    .wave-2      { animation: waveDrift2 8s linear infinite reverse; }
    .wave-3      { animation: waveDrift3 16s linear infinite; }
    .flag        { animation: flagWave 1.8s ease-in-out infinite; transform-origin: 0px -38px; }
    .cat-wiggle  { animation: catWiggle 2.6s ease-in-out infinite; transform-origin: -10px 14px; }
  </style>

  <!-- mountains (right side), transparent background behind them -->
  <g>
    <polygon points="760,262 895,108 1030,262" fill="#b6a8cf"/>
    <polygon points="840,262 985,140 1130,262" fill="#8f7fb3"/>
    <polygon points="950,262 1100,80 1250,262" fill="#6a5a8f"/>
  </g>

  <!-- purple flag on the tallest peak -->
  <g transform="translate(1100,80)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#4a3728" stroke-width="3" stroke-linecap="round"/>
    <polygon class="flag" points="0,-38 34,-27 0,-16" fill="#8e44ad"/>
  </g>

  <!-- ocean: smooth, seamless, layered sine waves -->
  <g>
    <!-- base water fill -->
    <rect x="0" y="258" width="1200" height="42" fill="#5aa9cc"/>

    <!-- far layer: soft, slow, lightest -->
    <g class="wave-1" opacity="0.5">
      <path fill="#bfe6f2" d="
        M-240,262
        C-210,254 -180,254 -150,262
        C-120,270 -90,270 -60,262
        C-30,254 0,254 30,262
        C60,270 90,270 120,262
        C150,254 180,254 210,262
        C240,270 270,270 300,262
        C330,254 360,254 390,262
        C420,270 450,270 480,262
        C510,254 540,254 570,262
        C600,270 630,270 660,262
        C690,254 720,254 750,262
        C780,270 810,270 840,262
        C870,254 900,254 930,262
        C960,270 990,270 1020,262
        C1050,254 1080,254 1110,262
        C1140,270 1170,270 1200,262
        C1230,254 1260,254 1290,262
        C1320,270 1350,270 1380,262
        C1410,254 1440,254 1440,262
        L1440,300 L-240,300 Z"/>
    </g>

    <!-- mid layer -->
    <g class="wave-2" opacity="0.55">
      <path fill="#9dd8ea" d="
        M-180,268
        C-150,258 -120,258 -90,268
        C-60,278 -30,278 0,268
        C30,258 60,258 90,268
        C120,278 150,278 180,268
        C210,258 240,258 270,268
        C300,278 330,278 360,268
        C390,258 420,258 450,268
        C480,278 510,278 540,268
        C570,258 600,258 630,268
        C660,278 690,278 720,268
        C750,258 780,258 810,268
        C840,278 870,278 900,268
        C930,258 960,258 990,268
        C1020,278 1050,278 1080,268
        C1110,258 1140,258 1170,268
        C1200,278 1230,278 1260,268
        C1290,258 1320,258 1350,268
        C1380,278 1410,278 1410,268
        L1410,300 L-180,300 Z"/>
    </g>

    <!-- near layer: crisper, faster, most saturated -->
    <g class="wave-3" opacity="0.85">
      <path fill="#3f93bb" d="
        M-300,276
        C-262,264 -224,264 -186,276
        C-148,288 -110,288 -72,276
        C-34,264 4,264 42,276
        C80,288 118,288 156,276
        C194,264 232,264 270,276
        C308,288 346,288 384,276
        C422,264 460,264 498,276
        C536,288 574,288 612,276
        C650,264 688,264 726,276
        C764,288 802,288 840,276
        C878,264 916,264 954,276
        C992,288 1030,288 1068,276
        C1106,264 1144,264 1182,276
        C1220,288 1258,288 1296,276
        C1334,264 1372,264 1410,276
        C1448,288 1486,288 1500,276
        L1500,300 L-300,300 Z"/>
    </g>
  </g>

  <!-- boat with sailing cat -->
  <g class="boat-sail">
    <g transform="translate(0,258)">
      <g class="bob">

        <!-- soft wake shadow -->
        <ellipse cx="0" cy="17" rx="46" ry="6" fill="#2c5f78" opacity="0.2"/>

        <!-- boat silhouette (noun-project style), positioned so the hull waterline sits at y=20 -->
        <svg x="-50" y="-73.4" width="100" height="93.3" viewBox="10 18 90 84" overflow="visible">
          <path fill="#5c3a1a" d="m93.539 67.414-48.02 4.3164v-3.1367c3.3945-1.5781 12.242-5.1484 23.43-5.457 7.9961-0.21875 12.68 0.30469 15.266 0.8125 1.3398 0.26562 2.5312-0.88672 2.2461-2.2266-2-9.4297-10.516-37.941-40.941-43.18v-9.8281c0-0.34766-0.28125-0.62891-0.62891-0.62891h-2.9922l-0.011719 1.8477c-3.1016 0.32812-4.1602 2.1797-6.7969 3.7617-1.5508 0.92969-4.8633 1.293-7.3242 1.4297-0.96094 0.054688-1.2383 1.332-0.39844 1.8086 8.3359 4.7266 14.523 1.5781 14.523 1.5781v53.539l-35.176 3.1602c-1.1797 0.10547-1.9883 1.2812-1.625 2.4102 2.5898 7.9648 10.797 14.285 10.797 14.285h58.609c12.891-6.4453 18.578-18.047 20.41-22.688 0.36328-0.92188-0.38281-1.8984-1.3672-1.8086zm-40.695-30.02c1.6094 13.375-0.035156 22.797-7.3281 25.656l0.003906-38.816c2.1914 0.58984 6.1094 3.0625 7.3281 13.16z"/>
          <path fill="#eaf6fb" opacity="0.85" d="m15.234 69.703 22.301-1.4219v-34.902c0-0.77734-1.0625-0.96094-1.3438-0.23438-4.4609 11.574-16.773 26.684-22.539 33.391-1.1094 1.293-0.11719 3.2773 1.582 3.1719z"/>
        </svg>

        <!-- black cat silhouette (noun-project style) sitting on the hull -->
        <g class="cat-wiggle">
          <svg x="-50" y="-45.5" width="40" height="41.5" viewBox="16.4 20 77.1 80" overflow="visible">
            <path fill="#1c1c1c" d="m86.809 23.078c0.41406-16.918-0.73047-15.711-9.957-6.0664-3.3945-0.6875-6.8984-0.73047-10.555 0-9.2383-9.6445-10.375-10.848-9.9492 6.0664-2.4414 4.2852-2.8164 10.91 1.6719 14.809-1.9453 2.1367-4.8828 4.1523-8.8125 6.0586-16.359 8.6016-20.727 22.234-19.348 38.305-0.44531-0.13281-0.88281-0.29297-1.2969-0.45703-2.5039-0.98438-4.4766-2.4609-5.5508-4.1836-1.2969-2.0547-1.5898-4.832-0.95312-8.7305 0.17188-1.082 0.41406-2.168 0.64844-3.3242 0.58594-2.7656 1.1836-5.6328 1.1328-8.6836-0.070313-5.4688-2.2695-10.82-6.168-15.074-1.3359-1.457-3.6055-1.5586-5.0547-0.22266-1.4688 1.3359-1.5586 3.5977-0.23438 5.0664 2.7148 2.957 4.2461 6.625 4.2969 10.332 0.03125 2.2578-0.46484 4.6094-0.98438 7.1133-0.25391 1.1758-0.50781 2.3789-0.71094 3.625-0.93359 5.6523-0.29297 10.129 1.957 13.715 1.8945 3.0078 5.0859 5.5 9.0078 7.0391 1.5312 0.59766 5.2891 1.4492 5.4609 1.4805 0.19141 0.039063 0.39453 0.050782 0.58594 0.050782h32.672c1.3359-0.19141 2.3594-1.3359 2.3594-2.7266 0-1.9766-1.6094-3.5859-3.5859-3.5859h-2.4297l0.49609-1.3594c1.7031-4.6797 1.8633-8.5586 0.47656-11.527-1.2773-2.7266-3.9102-4.8203-7.8398-6.25-0.52734-0.18359-0.80078-0.76953-0.60938-1.2969s0.76953-0.78906 1.2969-0.60938c4.457 1.6211 7.4766 4.0742 8.9844 7.293 1.4805 3.1797 1.5 7.1211 0.050782 11.73 2.8984 0.22266 5.1875 2.6523 5.1875 5.6016 0 1.0117-0.3125 1.957-0.85938 2.7266h7.4258c0.87109 0 1.6602-0.35547 2.2383-0.92188 0.69922-0.71094 1.082-1.7734 0.83984-2.9062-0.3125-1.4688-1.7031-2.4727-3.2109-2.4727h-1.5078v-18.699c7.1211-8.6602 7.0703-16.562 6.2891-24.293 10.555-4.3164 8.875-13.32 6.543-17.625zm-20.957 7.6172c-0.99219 0-1.8047-0.80859-1.8047-1.8047 0-0.99219 0.80859-1.8047 1.8047-1.8047 0.99219 0 1.793 0.80859 1.793 1.8047 0 0.99219-0.80078 1.8047-1.793 1.8047zm8.6719 1.6719-1.6328 1.7227c-0.17188 0.18359-0.45703 0.18359-0.62891 0l-1.6328-1.7227c-0.26172-0.27344-0.0625-0.73047 0.3125-0.73047h3.2617c0.375 0 0.57812 0.45703 0.3125 0.73047zm4.5469-1.6719c-0.99219 0-1.8047-0.80859-1.8047-1.8047 0-0.99219 0.80859-1.8047 1.8047-1.8047 0.99219 0 1.8047 0.80859 1.8047 1.8047 0 0.99219-0.80859 1.8047-1.8047 1.8047z"/>
          </svg>
        </g>
      </g>
    </g>
  </g>
</svg>